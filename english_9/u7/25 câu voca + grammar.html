        let currentQuestions = [];
        let score = 0;
        let answeredCount = 0;

        // Sound Effects (using simple beep URLs or generated tones)
        const soundCorrect = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3');
        const soundWrong = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3');
        const soundConfetti = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3');

        // Shuffle Function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Initialize Quiz
        function initQuiz() {
            // Clone deep
            currentQuestions = JSON.parse(JSON.stringify(rawData.questions));
            
            // 1. Shuffle Order of Questions
            shuffleArray(currentQuestions);
            
            // 2. Shuffle Order of Options INSIDE each question
            currentQuestions.forEach(q => {
                shuffleArray(q.answerOptions);
            });
            
            // Reset States
            score = 0;
            answeredCount = 0;
            document.getElementById('score-display').innerText = score;
            document.getElementById('quiz-container').innerHTML = '';
            document.getElementById('result-modal').classList.add('hidden');
            
            // Render all questions
            currentQuestions.forEach((q, index) => renderQuestion(q, index + 1));
        }

        // Parse Text for Markdown-like bolding AND Remove Hardcoded A/B/C/D prefixes in explanation
        function formatText(text) {
            if(!text) return "";
            
            // Remove "- A.", "- B." patterns to avoid confusion since we shuffled options
            // Logic: Replace "- A. word" with "- <strong>word</strong>" or just bullet
            let cleanText = text
                // Replace "- A. word" with "• word"
                .replace(/- [A-D]\.\s/g, '• ') 
                // Bold formatting
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
                
            return cleanText;
        }

        // Render Single Question Card
        function renderQuestion(qData, displayIndex) {
            const container = document.getElementById('quiz-container');
            
            const qDiv = document.createElement('div');
            qDiv.className = "bg-white rounded-3xl p-6 shadow-xl border-b-8 border-gray-200 relative overflow-hidden";
            qDiv.id = `q-card-${qData.questionNumber}`;

            let optionsHtml = '';
            const labels = ['A', 'B', 'C', 'D'];
            
            // Use the ALREADY SHUFFLED qData.answerOptions
            qData.answerOptions.forEach((opt, idx) => {
                optionsHtml += `
                    <button onclick="handleAnswer(this, ${qData.questionNumber}, ${opt.isCorrect}, '${labels[idx]}')" 
                        class="option-btn group w-full text-left p-4 rounded-xl border-2 border-gray-100 mb-3 btn-3d bg-white hover:bg-gray-50 flex items-center gap-4 transition-colors"
                        data-qid="${qData.questionNumber}" data-is-correct="${opt.isCorrect}">
                        <div class="w-10 h-10 rounded-lg bg-gray-100 text-gray-500 font-bold flex items-center justify-center group-hover:bg-theme-pink group-hover:text-white transition-colors">
                            ${labels[idx]}
                        </div>
                        <span class="font-semibold text-lg text-gray-700">${opt.text}</span>
                    </button>
                `;
            });

            // Find explanation text from the correct option (before shuffle or after, doesn't matter as object ref is same)
            const correctOpt = qData.answerOptions.find(o => o.isCorrect);
            const explanationText = correctOpt.rationale || "Chi tiết đang cập nhật.";

            qDiv.innerHTML = `
                <div class="mb-6">
                    <span class="inline-block bg-purple-100 text-purple-700 text-xs font-bold px-3 py-1 rounded-full mb-2">Question ${displayIndex}</span>
                    <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-snug">
                        ${qData.question}
                    </h3>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    ${optionsHtml}
                </div>

                <!-- Explanation Box (Hidden initially) -->
                <div id="explain-${qData.questionNumber}" class="explanation-box hidden rounded-xl p-5 mt-6 animate-fade-in">
                    <h4 class="font-bold text-theme-pink flex items-center gap-2 mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        MS Chí Nên Giải Thích Chi Tiết:
                    </h4>
                    <div class="text-gray-700 text-sm md:text-base leading-relaxed rationale-text">
                        ${formatText(explanationText)}
                    </div>
                </div>
            `;
            
            container.appendChild(qDiv);
        }

        // Handle Answer Click
        function handleAnswer(btn, qId, isCorrect, label) {
            const parentCard = document.getElementById(`q-card-${qId}`);
            const allBtns = parentCard.querySelectorAll('.option-btn');
            
            // Prevent multiple clicks
            if (btn.classList.contains('disabled')) return;
            
            // Disable all buttons in this card
            allBtns.forEach(b => {
                b.classList.add('disabled', 'cursor-not-allowed', 'opacity-80');
                b.onclick = null;
            });

            answeredCount++;
            updateProgress();

            if (isCorrect) {
                // Correct styling
                btn.classList.remove('bg-white', 'hover:bg-gray-50');
                btn.classList.add('bg-correct', 'border-green-600');
                btn.querySelector('div').classList.add('bg-green-700', 'text-white');
                
                // Sound & Confetti
                soundCorrect.currentTime = 0;
                soundCorrect.play();
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00D26A', '#8854C0', '#00C9A7']
                });
                
                score++;
                animateScore();
            } else {
                // Wrong styling
                btn.classList.remove('bg-white', 'hover:bg-gray-50');
                btn.classList.add('bg-wrong', 'border-red-600');
                btn.querySelector('div').classList.add('bg-red-700', 'text-white');
                
                // Add Shake Animation to the card
                parentCard.classList.add('shake-animation');
                
                // Sound
                soundWrong.currentTime = 0;
                soundWrong.play();

                // AUTOMATICALLY Highlight the correct answer so user knows
                allBtns.forEach(b => {
                    if(b.getAttribute('data-is-correct') === 'true') {
                        b.classList.remove('bg-white');
                        b.classList.add('bg-green-100', 'border-green-600', 'text-green-800');
                        b.querySelector('div').classList.add('bg-green-600', 'text-white');
                        // Optional: Add icon check?
                    }
                });
            }
            
            // SHOW EXPLANATION
            const explainDiv = document.getElementById(`explain-${qId}`);
            explainDiv.classList.remove('hidden');
            explainDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function updateProgress() {
            document.getElementById('progress-display').innerText = Math.min(answeredCount + 1, 25);
        }

        function animateScore() {
            const scoreEl = document.getElementById('score-display');
            scoreEl.innerText = score;
            scoreEl.classList.add('scale-150', 'text-green-600');
            setTimeout(() => scoreEl.classList.remove('scale-150', 'text-green-600'), 200);
        }

        // Finish Quiz
        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const finalScoreEl = document.getElementById('final-score');
            const msgEl = document.getElementById('final-message');
            
            finalScoreEl.innerText = score;
            
            if(score === 25) {
                msgEl.innerText = "Tuyệt đỉnh! Bạn là thiên tài! 🌟";
                soundConfetti.play();
            } else if (score >= 20) {
                msgEl.innerText = "Rất tốt! Cố chút nữa là hoàn hảo! 🔥";
            } else if (score >= 15) {
                msgEl.innerText = "Khá lắm! Hãy ôn lại các từ vựng nhé! 📚";
            } else {
                msgEl.innerText = "Cố gắng lên! Đừng nản chí nhé! 💪";
            }
            
            modal.classList.remove('hidden');
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetQuiz() {
            if(confirm("Bạn có muốn làm lại từ đầu không?")) {
                initQuiz();
            }
        }

        // Auto Init
        window.onload = initQuiz;

    </script>

<script>
// Remove password lock completely - direct quiz access
(function() {

            '#quiz-container, #quizContainer, #questions-container, #questionPane, #quiz, #questions, #quiz-body, #questions-wrapper, #quiz-list, #quizList, #exercise-container, #app-container .split-container'
        );
        for (var i = 0; i < containers.length; i++) {
            if (containers[i].querySelectorAll('button, input, select, textarea, .question-card, .question-block, .q-card, .quiz-card, .question-item, .q-box, .question, .option-btn, .opt-btn, .ans-btn').length > 0) {

        if (document.querySelectorAll('.question-card, .question-block, .q-card, .quiz-card, .question-item, .q-box, .option-btn, .opt-btn, .ans-btn, .choice-btn').length > 0) {
            return true;
        }
        return false;
    }

        if (renderCheckDone) return;
        renderCheckDone = true;
        if (hasRenderedQuiz()) return;

        if (!hasRenderedQuiz() && typeof buildQuiz === 'function') { try { buildQuiz(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof initQuiz === 'function') { try { initQuiz(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderApp === 'function') { try { renderApp(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderQuiz === 'function') { try { renderQuiz(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderQuestions === 'function') { try { renderQuestions(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderAllQuestions === 'function') { try { renderAllQuestions(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderAll === 'function') { try { renderAll(); } catch(e){} }
    }

    function unlockNow() {
        var pwIds = [
            'passwordModal', 'password-modal', 'pwModal', 'pw-modal', 'pw-overlay',
            'lockModal', 'passModal', 'authModal', 'auth-modal', 'lockOverlay',

            hideEl(document.getElementById(id), true);
        });

            if (el) hideEl(el, false);
        });

        var qo = document.getElementById('quiz-overlay');

            qo.style.display = 'none';
        }

        var mainIds = [
            'mainContent', 'main-content', 'mainHeader', 'main-header',
            'app-container', 'app', 'quizApp', 'quiz-wrapper', 'quizContainer', 'quiz-container', 'reading-content'

                if (window.getComputedStyle(el).display === 'none') {
                    var hasPane = el.querySelector('.pane, .left-pane, .right-pane, .split-container, .left-panel, .right-panel');

            qs.classList.remove('hidden');

                qs.classList.add('flex');

            } else {
                qs.style.display = 'block';
            }
        }

            initDone = true;

            if (document.getElementById('start-overlay') && typeof startGame === 'function') {
                var sn = document.getElementById('student-name') || document.getElementById('studentName');
                if (sn && !sn.value.trim()) sn.value = 'Học sinh';
            }
            if (document.getElementById('name-modal') && typeof startQuiz === 'function') {
                var sn2 = document.getElementById('student-name');
                if (sn2 && !sn2.value.trim()) sn2.value = 'Học sinh';
            }

            if (typeof startQuiz === 'function' && (typeof isStarted === 'undefined' || !isStarted)) { try { startQuiz(); } catch(e){} }
            if (typeof startGame === 'function') { try { startGame(); } catch(e){} }
            if (typeof startTest === 'function') { try { startTest(); } catch(e){} }
            if (typeof startApp === 'function') { try { startApp(); } catch(e){} }
            if (typeof buildStarfield === 'function') { try { buildStarfield(); } catch(e){} }
            if (typeof spawnFloats === 'function') { try { spawnFloats(); } catch(e){} }
            if (typeof spawnFloaters === 'function') { try { spawnFloaters(); } catch(e){} }
            if (typeof createFloatingBubbles === 'function') { try { createFloatingBubbles(); } catch(e){} }
            if (typeof initAudio === 'function') { try { initAudio(); } catch(e){} }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockNow);
    } else {
        unlockNow();
    }
    if (document.readyState === 'complete') {
        setTimeout(ensureQuizRendered, 150);
    } else {
        window.addEventListener('load', function() {
            setTimeout(unlockNow, 20);
            setTimeout(ensureQuizRendered, 150);
            setTimeout(unlockNow, 300);
            setTimeout(unlockNow, 700);
        });
    }
    setTimeout(unlockNow, 50);
    setTimeout(unlockNow, 200);
    setTimeout(unlockNow, 600);
    setTimeout(unlockNow, 1100);
})();
</script>
