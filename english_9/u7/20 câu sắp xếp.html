<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Wonders Quiz - MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Tím Pastel */
            --secondary: #00C9A7; /* Xanh Ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f3f8;
            --card-bg: #ffffff;
            --text-main: #2f3542;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Chống bôi đen để trải nghiệm giống app */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#dcdde1 15%, transparent 16%), radial-gradient(#dcdde1 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* HEADER STYLE */
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid #eee;
            position: relative;
            overflow: hidden;
        }

        .header h1 {
            color: var(--primary);
            font-family: 'Quicksand', sans-serif;
            font-weight: 900;
            margin: 0;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header h2 {
            color: #57606f;
            font-size: 1rem;
            margin-top: 5px;
            font-weight: 600;
        }

        .score-board {
            position: absolute;
            top: 15px;
            right: 20px;
            background: var(--secondary);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        /* QUESTION CARD */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            border: 2px solid #f1f2f6;
            transition: transform 0.3s ease;
            position: relative;
        }

        .question-badge {
            display: inline-block;
            background: #ffa502;
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2f3542;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* OPTIONS GRID */
        .options-grid {
            display: grid;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e1e1;
            border-bottom: 5px solid #e1e1e1; /* 3D effect */
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            color: #57606f;
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary);
            color: var(--primary);
            background-color: #f8effc;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
            margin-top: 3px;
        }

        .option-letter {
            background: #dfe4ea;
            color: #747d8c;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            margin-right: 15px;
            flex-shrink: 0;
        }

        /* CORRECT / WRONG STATES */
        .option-btn.correct {
            background-color: #d1f7c4;
            border-color: var(--correct);
            border-bottom-color: #00b85c;
            color: #00944a;
        }

        .option-btn.correct .option-letter {
            background: var(--correct);
            color: white;
        }

        .option-btn.wrong {
            background-color: #ffeaa7;
            border-color: var(--wrong);
            border-bottom-color: #ff2e42;
            color: #d63031;
            animation: shake 0.5s;
        }

        .option-btn.wrong .option-letter {
            background: var(--wrong);
            color: white;
        }

        /* EXPLANATION BOX */
        .explanation-box {
            margin-top: 20px;
            background: #f1f2f6;
            border-radius: 15px;
            padding: 20px;
            border-left: 6px solid var(--primary);
            display: none; /* Hidden by default */
            animation: slideDown 0.3s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-header svg {
            width: 24px;
            height: 24px;
        }

        .explanation-content p {
            margin: 5px 0;
            line-height: 1.5;
        }

        .rationale-highlight {
            font-weight: bold;
            color: #2f3542;
        }

        /* SUBMIT BUTTON */
        .submit-section {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 50px;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-bottom: 6px solid #6c429c;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.4);
        }

        .submit-btn:hover {
            transform: scale(1.05);
            background: #9b59d6;
        }

        .submit-btn:active {
            transform: scale(0.95) translateY(4px);
            border-bottom-width: 2px;
            box-shadow: none;
        }

        /* ANIMATIONS */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CONFETTI CANVAS */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* MODAL RESULT */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid var(--primary);
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .final-score {
            font-size: 3rem;
            font-weight: 900;
            color: var(--secondary);
            margin: 20px 0;
        }

        .teacher-comment {
            font-size: 1.2rem;
            color: #57606f;
            margin-bottom: 30px;
        }

    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <div class="header">
            <h1>Sắp xếp câu: Natural Wonders</h1>
            <h2>Giáo viên tạo: MS Chí Nên</h2>
            <div class="score-board">
                Điểm: <span id="current-score">0</span>/20
            </div>
        </div>

        <div id="quiz-container">
            <!-- Questions will be injected here via JS -->
        </div>

        <div class="submit-section">
            <button class="submit-btn" onclick="finishQuiz()">NỘP BÀI 🚀</button>
        </div>
    </div>

    <!-- RESULT MODAL -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--primary); font-size: 2rem; margin: 0;">KẾT QUẢ</h2>
            <div class="final-score" id="final-score-display">0/20</div>
            <p class="teacher-comment" id="teacher-comment">...</p>
            <button class="submit-btn" onclick="location.reload()" style="font-size: 1.2rem; padding: 10px 30px;">Làm lại bài 🔄</button>
        </div>
    </div>

        let currentScore = 0;

        // --- SOUND GENERATOR (WEB AUDIO API) ---
        // Không phụ thuộc vào file bên ngoài, chạy trên mọi trình duyệt
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Tiếng Ding: Sine wave cao độ cao, tắt dần
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } else {
                // Tiếng Buzz: Sawtooth thấp, rè
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- CONFETTI EFFECT ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#8854C0', '#00C9A7', '#ff4757', '#ffa502', '#2ed573'];

            for (let i = 0; i < 100; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vy: Math.random() * 4 + 2,
                    vx: Math.random() * 2 - 1
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                pieces.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    if (p.y < canvas.height) active = true;
                });
                if (active) requestAnimationFrame(animate);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            animate();
        }

        // --- QUIZ LOGIC ---

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initQuiz() {
            // Sao chép và xáo trộn câu hỏi
            shuffledQuestions = JSON.parse(JSON.stringify(rawData.questions));
            shuffleArray(shuffledQuestions);

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            shuffledQuestions.forEach((q, index) => {
                // --- THÊM MỚI: Xáo trộn các đáp án trong từng câu hỏi ---
                shuffleArray(q.answerOptions);

                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `q-card-${index}`;

                // Tìm đáp án đúng để lấy explanation chuẩn
                const correctOption = q.answerOptions.find(opt => opt.isCorrect);

                // Tạo HTML cho các lựa chọn (A, B, C, D)
                let optionsHTML = '';
                q.answerOptions.forEach((opt, optIndex) => {
                    // Tạo nhãn A, B, C, D động dựa trên vị trí mới
                    const dynamicLabel = String.fromCharCode(65 + optIndex); 
                    // Xóa phần A., B. cũ cứng trong text gốc để tránh bị lặp (ví dụ: "A. B. ...")
                    const cleanText = opt.text.replace(/^[A-D]\.\s*/, '');

                    optionsHTML += `
                        <button class="option-btn" 
                                id="btn-${index}-${optIndex}" 
                                onclick="checkAnswer(${index}, ${optIndex}, ${opt.isCorrect})">
                            <div class="option-letter">${dynamicLabel}</div>
                            ${cleanText}
                        </button>
                    `;
                });

                // Xây dựng nội dung Box giải thích tổng hợp
                // Lấy rationale của tất cả đáp án để hiển thị
                let combinedExplanation = `<div style="margin-bottom: 10px;"><strong>Gợi ý ban đầu:</strong> ${q.hint}</div>`;
                combinedExplanation += `<div style="margin-bottom: 10px;">${correctOption.rationale}</div>`; // Rationale của câu đúng thường chứa bản dịch và cấu trúc
                
                // Thêm phân tích lỗi sai từ các câu sai
                combinedExplanation += `<strong>Tại sao các câu khác sai?</strong><ul style="margin: 5px 0 0 20px; padding: 0;">`;
                q.answerOptions.forEach((opt, optIndex) => {
                    if (!opt.isCorrect) {
                        // Tính toán lại Label cho phần giải thích khớp với giao diện
                        const dynamicLabel = String.fromCharCode(65 + optIndex);
                        // Loại bỏ các ký tự Markdown ** nếu có để hiển thị đẹp hơn
                        let cleanRationale = opt.rationale.replace(/\*\*/g, '');
                        combinedExplanation += `<li><strong>${dynamicLabel}:</strong> ${cleanRationale}</li>`;
                    }
                });
                combinedExplanation += `</ul>`;

                card.innerHTML = `
                    <div class="question-badge">Câu ${index + 1}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid">
                        ${optionsHTML}
                    </div>
                    <div class="explanation-box" id="explain-${index}">
                        <div class="explanation-header">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                            MS Chí Nên giải thích:
                        </div>
                        <div class="explanation-content">
                            ${combinedExplanation}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswer(questionIndex, optionIndex, isCorrect) {
            const card = document.getElementById(`q-card-${questionIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const selectedBtn = document.getElementById(`btn-${questionIndex}-${optionIndex}`);
            const explainBox = document.getElementById(`explain-${questionIndex}`);
            
            // Chặn click lại
            if (card.getAttribute('data-answered') === 'true') return;
            card.setAttribute('data-answered', 'true');

            // Hiển thị kết quả
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                playSound('correct');
                fireConfetti();
                currentScore++;
                document.getElementById('current-score').innerText = currentScore;
            } else {
                selectedBtn.classList.add('wrong');
                playSound('wrong');
                // Tìm và hiện đáp án đúng
                buttons.forEach(btn => {
                    // Logic tìm nút đúng dựa trên onclick attribute (hơi thủ công nhưng nhanh gọn cho static HTML)
                    if (btn.getAttribute('onclick').includes('true')) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Disable tất cả buttons
            buttons.forEach(btn => btn.disabled = true);

            // Hiện giải thích
            explainBox.style.display = 'block';
        }

        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('final-score-display');
            const comment = document.getElementById('teacher-comment');
            
            scoreDisplay.innerText = `${currentScore}/20`;
            
            if (currentScore === 20) {
                comment.innerText = "Xuất sắc! Em là thiên tài ngữ pháp! 🌟💯";
                fireConfetti();
            } else if (currentScore >= 15) {
                comment.innerText = "Rất tốt! Em nắm bài rất chắc! Keep it up! 👏";
            } else if (currentScore >= 10) {
                comment.innerText = "Khá lắm! Cố gắng ôn thêm cấu trúc câu em nhé! 💪";
            } else {
                comment.innerText = "Đừng buồn nhé! Hãy xem kỹ lại phần giải thích của cô để làm tốt hơn lần sau! ❤️";
            }

            modal.style.display = 'flex';
            playSound('correct');
        }

        // Khởi tạo
        initQuiz();

    </script>

                }
                if (window.getComputedStyle(el).display === 'none') {
                    var hasPane = el.querySelector('.pane, .left-pane, .right-pane, .split-container, .left-panel, .right-panel');
                    if (id === 'main-content' || id.toLowerCase().includes('header') || el.classList.contains('main-container') || hasPane) {
                        el.style.setProperty('display', 'flex', 'important');
                    } else {
                        el.style.setProperty('display', 'block', 'important');
                    }
                }
            }
        });

        var qs = document.getElementById('quiz-screen');
        if (qs) {
            qs.classList.remove('hidden');
            if (qs.classList.contains('flex-col')) {
                qs.classList.add('flex');
                qs.style.display = 'flex';
            } else {
                qs.style.display = 'block';
            }
        }

        if (!initDone) {
            initDone = true;

            if (document.getElementById('start-overlay') && typeof startGame === 'function') {
                var sn = document.getElementById('student-name') || document.getElementById('studentName');
                if (sn && !sn.value.trim()) sn.value = 'Học sinh';
            }
            if (document.getElementById('name-modal') && typeof startQuiz === 'function') {
                var sn2 = document.getElementById('student-name');
                if (sn2 && !sn2.value.trim()) sn2.value = 'Học sinh';
            }

            if (typeof startQuiz === 'function' && (typeof isStarted === 'undefined' || !isStarted)) { try { startQuiz(); } catch(e){} }
            if (typeof startGame === 'function') { try { startGame(); } catch(e){} }
            if (typeof startTest === 'function') { try { startTest(); } catch(e){} }
            if (typeof startApp === 'function') { try { startApp(); } catch(e){} }
            if (typeof buildStarfield === 'function') { try { buildStarfield(); } catch(e){} }
            if (typeof spawnFloats === 'function') { try { spawnFloats(); } catch(e){} }
            if (typeof spawnFloaters === 'function') { try { spawnFloaters(); } catch(e){} }
            if (typeof createFloatingBubbles === 'function') { try { createFloatingBubbles(); } catch(e){} }
            if (typeof initAudio === 'function') { try { initAudio(); } catch(e){} }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockNow);
    } else {
        unlockNow();
    }
    if (document.readyState === 'complete') {
        setTimeout(ensureQuizRendered, 150);
    } else {
        window.addEventListener('load', function() {
            setTimeout(unlockNow, 20);
            setTimeout(ensureQuizRendered, 150);
            setTimeout(unlockNow, 300);
            setTimeout(unlockNow, 700);
        });
    }
    setTimeout(unlockNow, 50);
    setTimeout(unlockNow, 200);
    setTimeout(unlockNow, 600);
    setTimeout(unlockNow, 1100);
})();
</script>
</body>
</html>
