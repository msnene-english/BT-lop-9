<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tập Giao tiếp Tiếng Anh (Exchanges) - MS Chí Nên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #f0f3f5;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d7d7d7 1px, transparent 1px), radial-gradient(#d7d7d7 1px, transparent 1px);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid #eee;
        }

        h1 {
            color: var(--primary-purple);
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            font-weight: 800;
            font-size: 1.8rem;
        }

        .sub-header {
            color: #7f8c8d;
            font-size: 1rem;
            margin-top: 5px;
        }

        /* Progress Bar */
        .progress-container {
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 15px;
            width: 100%;
            margin-bottom: 25px;
            overflow: hidden;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .progress-bar {
            background-color: var(--primary-teal);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
            border-radius: 10px;
        }

        /* Question Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.15);
            margin-bottom: 30px;
            border: 2px solid #fff;
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }

        .question-number {
            display: inline-block;
            background: var(--primary-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #2c3e50;
            white-space: pre-wrap; /* Preserve line breaks in dialogues */
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* 3D Button Styles */
        .option-btn {
            background-color: white;
            border: 2px solid #e0e0e0;
            border-bottom: 6px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-purple);
            border-bottom-color: var(--primary-purple);
            color: var(--primary-purple);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .option-btn:disabled {
            cursor: default;
            transform: none !important;
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background-color: var(--correct-green);
            color: white;
            border-color: #00a352;
            border-bottom-color: #008f48;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red);
            color: white;
            border-color: #d63031;
            border-bottom-color: #c0392b;
            animation: shake 0.5s;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background-color: #f1f9ff;
            border: 2px solid #dbe9f6;
            border-left: 5px solid var(--primary-purple);
            border-radius: 10px;
            padding: 20px;
            display: none; /* Hidden initially */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-title {
            font-weight: 800;
            color: var(--primary-purple);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .explanation-content strong {
            color: #2c3e50;
        }

        /* Submit Button */
        .submit-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 40px auto;
            background-color: var(--primary-teal);
            color: white;
            border: none;
            border-bottom: 6px solid #009e82;
            padding: 15px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0, 201, 167, 0.3);
        }

        .submit-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .submit-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
            box-shadow: none;
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .result-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid var(--primary-purple);
        }

        .modal-overlay.active .result-card {
            transform: scale(1);
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-purple);
            margin: 20px 0;
        }

        .praise-text {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
        }

        .restart-btn {
            background-color: var(--primary-purple);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(136, 84, 192, 0.4);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Utility */
        .hidden { display: none !important; }
        
        /* Markdown styling in rationale */
        .rationale-text ul {
            padding-left: 20px;
            margin: 10px 0;
        }
        .rationale-text li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-graduation-cap"></i> MS Chí Nên</h1>
        <div class="sub-header">Luyện tập Giao tiếp Tiếng Anh (Exchanges) - Daily English</div>
    </header>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-area">
        <!-- Questions will be injected here by JS -->
    </div>

    <button class="submit-btn hidden" id="submit-btn" onclick="showResults()">
        <i class="fas fa-paper-plane"></i> Nộp Bài & Xem Điểm
    </button>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="result-modal">
    <div class="result-card">
        <i class="fas fa-trophy" style="font-size: 4rem; color: #f1c40f; margin-bottom: 10px;"></i>
        <h2>Kết Quả Của Bạn</h2>
        <div class="score-display" id="final-score">0/10</div>
        <div class="praise-text" id="praise-text">Tuyệt vời!</div>
        <button class="restart-btn" onclick="location.reload()">
            <i class="fas fa-redo"></i> Làm Lại
        </button>
    </div>
</div>

<script>
    // --- DỮ LIỆU ĐỀ BÀI (Từ Prompt) ---
    const rawData = {
        "questions": [
            {
                "questionNumber": 1,
                "question": "1. Tom: \"Have you ever visited Ha Long Bay?\"\nMai: \"____________________\"",
                "answerOptions": [
                    { "text": "A. Ha Long Bay is in Quang Ninh province.", "isCorrect": false },
                    { "text": "B. Yes, I went there last summer with my family.", "isCorrect": true },
                    { "text": "C. It has thousands of limestone islands.", "isCorrect": false },
                    { "text": "D. Many tourists go there every year.", "isCorrect": false }
                ],
                "rationale": "**Dịch chi tiết:**\n- A. Vịnh Hạ Long nằm ở tỉnh Quảng Ninh. (Fact - Sự thật)\n- B. Có, tớ đã đến đó mùa hè năm ngoái cùng gia đình. (Answer - Câu trả lời trực tiếp)\n- C. Nó có hàng nghìn đảo đá vôi. (Description - Mô tả)\n- D. Nhiều du khách đến đó hàng năm. (Fact - Sự thật)\n\n**Giải thích:** Câu hỏi bắt đầu bằng \"Have you ever...?\" (Bạn đã bao giờ... chưa?), đây là câu hỏi về trải nghiệm cá nhân (Yes/No). Đáp án B là câu trả lời phù hợp nhất vì nó xác nhận (Yes) và đưa ra thông tin cụ thể về thời gian.\n\n**Dịch hội thoại:**\nTom: \"Cậu đã bao giờ đến thăm Vịnh Hạ Long chưa?\"\nMai: \"Có, tớ đã đến đó mùa hè năm ngoái cùng gia đình.\""
            },
            {
                "questionNumber": 2,
                "question": "2. Sarah: \"What do you think about the Grand Canyon?\"\nJohn: \"____________________\"",
                "answerOptions": [
                    { "text": "A. It's located in Arizona.", "isCorrect": false },
                    { "text": "B. Millions of people visit it.", "isCorrect": false },
                    { "text": "C. It was formed millions of years ago.", "isCorrect": false },
                    { "text": "D. It's absolutely breathtaking!", "isCorrect": true }
                ],
                "rationale": "**Dịch chi tiết:**\n- A. Nó nằm ở Arizona. (Location - Vị trí)\n- B. Hàng triệu người đến thăm nó. (Statistic - Số liệu)\n- C. Nó được hình thành từ hàng triệu năm trước. (History - Lịch sử)\n- D. Nó hoàn toàn ngoạn mục! (Opinion - Ý kiến)\n\n**Giải thích:** Câu hỏi \"What do you think about...?\" dùng để hỏi ý kiến/cảm nghĩ. Đáp án A, B, C chỉ là các sự kiện thực tế. Chỉ có đáp án D thể hiện cảm xúc/đánh giá cá nhân (\"breathtaking\" - đẹp đến nín thở).\n\n**Dịch hội thoại:**\nSarah: \"Cậu nghĩ gì về Grand Canyon?\"\nJohn: \"Nó hoàn toàn ngoạn mục!\""
            },
            {
                "questionNumber": 3,
                "question": "3. Lisa: \"How can we protect coral reefs from damage?\"\nDavid: \"____________________\"",
                "answerOptions": [
                    { "text": "A. Coral reefs are very colorful.", "isCorrect": false },
                    { "text": "B. They are found in warm waters.", "isCorrect": false },
                    { "text": "C. We should stop using harmful sunscreens.", "isCorrect": true },
                    { "text": "D. Many fish live in coral reefs.", "isCorrect": false }
                ],
                "rationale": "**Dịch chi tiết:**\n- A. Các rạn san hô rất sặc sỡ. (Description - Mô tả)\n- B. Chúng được tìm thấy ở vùng nước ấm. (Location - Vị trí)\n- C. Chúng ta nên ngừng sử dụng kem chống nắng độc hại. (Solution - Giải pháp)\n- D. Nhiều loài cá sống trong các rạn san hô. (Fact - Sự thật)\n\n**Giải thích:** Câu hỏi \"How can we...?\" hỏi về phương pháp hoặc giải pháp. Đáp án C đưa ra một hành động cụ thể (\"stop using harmful sunscreens\") để bảo vệ san hô.\n\n**Dịch hội thoại:**\nLisa: \"Làm thế nào chúng ta có thể bảo vệ các rạn san hô khỏi bị hư hại?\"\nDavid: \"Chúng ta nên ngừng sử dụng các loại kem chống nắng độc hại.\""
            },
            {
                "questionNumber": 4,
                "question": "4. Peter: \"Would you like to join our trip to the national park?\"\nAnna: \"____________________\"",
                "answerOptions": [
                    { "text": "A. The park has many animals.", "isCorrect": false },
                    { "text": "B. National parks are important.", "isCorrect": false },
                    { "text": "C. I'd love to! When are you going?", "isCorrect": true },
                    { "text": "D. The park is very large.", "isCorrect": false }
                ],
                "rationale": "**Dịch chi tiết:**\n- A. Công viên có nhiều động vật. (Fact - Sự thật)\n- B. Các công viên quốc gia rất quan trọng. (Opinion - Ý kiến chung)\n- C. Tớ rất thích! Khi nào các cậu đi? (Acceptance - Chấp nhận lời mời)\n- D. Công viên rất rộng. (Description - Mô tả)\n\n**Giải thích:** \"Would you like to...?\" là câu mời mọc. Đáp án C thể hiện sự đồng ý và hào hứng (\"I'd love to\") kèm theo câu hỏi chi tiết về chuyến đi, đây là phản hồi tự nhiên nhất.\n\n**Dịch hội thoại:**\nPeter: \"Cậu có muốn tham gia chuyến đi đến công viên quốc gia cùng bọn tớ không?\"\nAnna: \"Tớ rất thích! Khi nào các cậu đi?\""
            },
            {
                "questionNumber": 5,
                "question": "5. Mike: \"Why is the Amazon rainforest important?\"\nEmma: \"____________________\"",
                "answerOptions": [
                    { "text": "A. It is home to incredible biodiversity and helps regulate the climate.", "isCorrect": true },
                    { "text": "B. It's in South America.", "isCorrect": false },
                    { "text": "C. Many tourists visit it.", "isCorrect": false },
                    { "text": "D. The Amazon river is very long.", "isCorrect": false }
                ],
                "rationale": "**Dịch chi tiết:**\n- A. Nó là nhà của sự đa dạng sinh học đáng kinh ngạc và giúp điều hòa khí hậu. (Reason - Lý do)\n- B. Nó ở Nam Mỹ. (Location - Vị trí)\n- C. Nhiều du khách đến thăm nó. (Fact - Sự thật)\n- D. Sông Amazon rất dài. (Fact - Sự thật)\n\n**Giải thích:** Câu hỏi \"Why\" (Tại sao) yêu cầu một lý do hoặc giải thích. Đáp án A giải thích vai trò quan trọng của rừng Amazon (đa dạng sinh học, điều hòa khí hậu).\n\n**Dịch hội thoại:**\nMike: \"Tại sao rừng mưa nhiệt đới Amazon lại quan trọng?\"\nEmma: \"Nó là nơi trú ngụ của hệ sinh thái đa dạng đáng kinh ngạc và giúp điều hòa khí hậu.\""
            },
            {
                "questionNumber": 6,
                "question": "6. Kate: \"The Northern Lights are amazing!\"\nBen: \"____________________\"",
                "answerOptions": [
                    { "text": "A. They happen in northern countries.", "isCorrect": false },
                    { "text": "B. I totally agree! They're magical.", "isCorrect": true },
                    { "text": "C. They are also called Aurora Borealis.", "isCorrect": false },
                    { "text": "D. Many photographers take pictures of them.", "isCorrect": false }
                ],
                "rationale": "**Dịch chi tiết:**\n- A. Chúng xảy ra ở các nước phương bắc. (Fact - Sự thật)\n- B. Tớ hoàn toàn đồng ý! Chúng thật kỳ diệu. (Agreement - Sự đồng tình)\n- C. Chúng còn được gọi là Aurora Borealis. (Name - Tên gọi)\n- D. Nhiều nhiếp ảnh gia chụp ảnh chúng. (Fact - Sự thật)\n\n**Giải thích:** Kate đang đưa ra một lời khen/cảm thán (\"amazing\"). Phản hồi tự nhiên nhất của Ben là thể hiện sự đồng tình hoặc chia sẻ cảm xúc đó. Đáp án B (\"I totally agree\") là phù hợp nhất.\n\n**Dịch hội thoại:**\nKate: \"Bắc Cực Quang thật tuyệt vời!\"\nBen: \"Tớ hoàn toàn đồng ý! Chúng thật kỳ diệu.\""
            },
            {
                "questionNumber": 7,
                "question": "7. Tour guide: \"Please don't touch the coral when diving.\"\nTourist: \"____________________\"",
                "answerOptions": [
                    { "text": "A. The water is very clear here.", "isCorrect": false },
                    { "text": "B. There are many types of fish.", "isCorrect": false },
                    { "text": "C. I understand. I'll be careful.", "isCorrect": true },
                    { "text": "D. Diving is very exciting.", "isCorrect": false }
                ],
                "rationale": "**Dịch chi tiết:**\n- A. Nước ở đây rất trong. (Observation - Quan sát)\n- B. Có rất nhiều loại cá. (Observation - Quan sát)\n- C. Tôi hiểu rồi. Tôi sẽ cẩn thận. (Compliance - Tuân thủ)\n- D. Lặn biển rất thú vị. (Opinion - Ý kiến)\n\n**Giải thích:** Hướng dẫn viên đưa ra một yêu cầu/cảnh báo (\"Please don't...\"). Du khách cần phản hồi xác nhận đã hiểu và sẽ tuân thủ. Đáp án C là phù hợp nhất.\n\n**Dịch hội thoại:**\nHướng dẫn viên: \"Làm ơn đừng chạm vào san hô khi lặn.\"\nDu khách: \"Tôi hiểu rồi. Tôi sẽ cẩn thận.\""
            },
            {
                "questionNumber": 8,
                "question": "8. Jane: \"How long does it take to climb Mount Everest?\"\nGuide: \"____________________\"",
                "answerOptions": [
                    { "text": "A. Mount Everest is the highest mountain.", "isCorrect": false },
                    { "text": "B. Usually about two months including preparation.", "isCorrect": true },
                    { "text": "C. It's located between Nepal and Tibet.", "isCorrect": false },
                    { "text": "D. Many climbers attempt it every year.", "isCorrect": false }
                ],
                "rationale": "**Dịch chi tiết:**\n- A. Đỉnh Everest là ngọn núi cao nhất. (Fact - Sự thật)\n- B. Thường mất khoảng hai tháng bao gồm cả chuẩn bị. (Duration - Thời lượng)\n- C. Nó nằm giữa Nepal và Tây Tạng. (Location - Vị trí)\n- D. Nhiều người leo núi thử sức hàng năm. (Fact - Sự thật)\n\n**Giải thích:** Câu hỏi \"How long\" hỏi về khoảng thời gian. Đáp án B cung cấp thông tin thời gian (\"about two months\").\n\n**Dịch hội thoại:**\nJane: \"Mất bao lâu để leo lên đỉnh Everest?\"\nHướng dẫn viên: \"Thường mất khoảng hai tháng bao gồm cả công tác chuẩn bị.\""
            },
            {
                "questionNumber": 9,
                "question": "9. Mark: \"I'm worried about endangered animals in national parks.\"\nLucy: \"____________________\"",
                "answerOptions": [
                    { "text": "A. National parks have many visitors.", "isCorrect": false },
                    { "text": "B. Animals live in their natural habitat.", "isCorrect": false },
                    { "text": "C. Parks are open all year round.", "isCorrect": false },
                    { "text": "D. Me too. We need stronger protection laws.", "isCorrect": true }
                ],
                "rationale": "**Dịch chi tiết:**\n- A. Các công viên quốc gia có nhiều du khách. (Fact - Sự thật)\n- B. Động vật sống trong môi trường tự nhiên của chúng. (Fact - Sự thật)\n- C. Các công viên mở cửa quanh năm. (Fact - Sự thật)\n- D. Tớ cũng vậy. Chúng ta cần luật bảo vệ mạnh mẽ hơn. (Agreement/Empathy - Đồng cảm)\n\n**Giải thích:** Mark đang chia sẻ một nỗi lo lắng (\"I'm worried\"). Lucy nên thể hiện sự đồng cảm hoặc cùng quan điểm. Đáp án D (\"Me too\") thể hiện sự đồng tình và đề xuất giải pháp.\n\n**Dịch hội thoại:**\nMark: \"Tớ lo lắng về các loài động vật có nguy cơ tuyệt chủng trong các công viên quốc gia.\"\nLucy: \"Tớ cũng vậy. Chúng ta cần những luật lệ bảo vệ mạnh mẽ hơn.\""
            },
            {
                "questionNumber": 10,
                "question": "10. Amy: \"What should I bring for tomorrow's waterfall trip?\"\nJack: \"____________________\"",
                "answerOptions": [
                    { "text": "A. The waterfall is 50 meters high.", "isCorrect": false },
                    { "text": "B. Don't forget comfortable shoes and a raincoat.", "isCorrect": true },
                    { "text": "C. Many people visit the waterfall.", "isCorrect": false },
                    { "text": "D. The waterfall is in the forest.", "isCorrect": false }
                ],
                "rationale": "**Dịch chi tiết:**\n- A. Thác nước cao 50 mét. (Fact - Sự thật)\n- B. Đừng quên giày thoải mái và áo mưa nhé. (Advice - Lời khuyên)\n- C. Nhiều người đến thăm thác nước. (Fact - Sự thật)\n- D. Thác nước nằm trong rừng. (Location - Vị trí)\n\n**Giải thích:** Câu hỏi \"What should I bring...?\" là xin lời khuyên về đồ đạc cần mang. Đáp án B đưa ra lời khuyên cụ thể (\"Don't forget...\") về các vật dụng cần thiết.\n\n**Dịch hội thoại:**\nAmy: \"Tớ nên mang gì cho chuyến đi thác nước ngày mai?\"\nJack: \"Đừng quên giày thoải mái và áo mưa nhé.\""
            }
        ]
    };

    // Shuffle Function
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // State
    let quizData = shuffleArray([...rawData.questions]);
    let userScore = 0;
    let answeredCount = 0;
    const totalQuestions = quizData.length;

    // --- SOUND ENGINE (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // Ding! High pitch sine
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'wrong') {
            // Buzz! Low pitch sawtooth
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // --- MARKDOWN PARSER (Simple) ---
    function parseMarkdown(text) {
        let html = text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
            .replace(/\n/g, '<br>') // Newlines
            .replace(/- /g, '• '); // Lists
        return html;
    }

    // --- RENDER LOGIC ---
    function initQuiz() {
        const quizArea = document.getElementById('quiz-area');
        quizArea.innerHTML = '';

        quizData.forEach((q, index) => {
            // Create Card
            const card = document.createElement('div');
            card.className = 'quiz-card';
            
            // Question Text
            const qNum = document.createElement('div');
            qNum.className = 'question-number';
            qNum.innerText = `Câu hỏi ${index + 1}`;
            
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerText = q.question;

            // Options Grid
            const grid = document.createElement('div');
            grid.className = 'options-grid';

            q.answerOptions.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span style="margin-right:10px; font-weight:800;"></span> ${opt.text}`;
                btn.onclick = () => handleAnswer(index, optIndex, btn, q.rationale, opt.isCorrect);
                grid.appendChild(btn);
            });

            // Explanation Box
            const expl = document.createElement('div');
            expl.className = 'explanation-box';
            expl.id = `expl-${index}`;
            expl.innerHTML = `
                <div class="explanation-title"><i class="fas fa-lightbulb"></i> Giải thích chi tiết của MS Chí Nên:</div>
                <div class="explanation-content rationale-text">${parseMarkdown(q.rationale)}</div>
            `;

            card.appendChild(qNum);
            card.appendChild(qText);
            card.appendChild(grid);
            card.appendChild(expl);
            quizArea.appendChild(card);
        });
    }

    function handleAnswer(qIndex, optIndex, btnElement, rationale, isCorrect) {
        // Prevent re-answering logic if desired, but here we disable siblings
        const card = btnElement.closest('.quiz-card');
        const buttons = card.querySelectorAll('.option-btn');
        
        // Check if already answered
        let alreadyAnswered = false;
        buttons.forEach(b => {
            if (b.disabled) alreadyAnswered = true;
        });
        if (alreadyAnswered) return;

        // Disable all buttons in this card
        buttons.forEach(b => b.disabled = true);

        // UI Feedback
        if (isCorrect) {
            btnElement.classList.add('correct');
            btnElement.innerHTML += ' <i class="fas fa-check-circle" style="margin-left:auto;"></i>';
            playSound('correct');
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#00C9A7', '#8854C0', '#F1C40F']
            });
            userScore++;
        } else {
            btnElement.classList.add('wrong');
            btnElement.innerHTML += ' <i class="fas fa-times-circle" style="margin-left:auto;"></i>';
            playSound('wrong');
            // Highlight correct one
            quizData[qIndex].answerOptions.forEach((opt, i) => {
                if (opt.isCorrect) {
                    buttons[i].classList.add('correct');
                    buttons[i].innerHTML += ' <i class="fas fa-check-circle" style="margin-left:auto;"></i>';
                }
            });
        }

        // Show Explanation Immediately
        const explBox = document.getElementById(`expl-${qIndex}`);
        explBox.classList.add('show');

        // Update Progress
        answeredCount++;
        updateProgress();

        // Check if all answered
        if (answeredCount === totalQuestions) {
            document.getElementById('submit-btn').classList.remove('hidden');
            // Scroll to submit button smoothly
            setTimeout(() => {
                document.getElementById('submit-btn').scrollIntoView({ behavior: 'smooth' });
            }, 500);
        }
    }

    function updateProgress() {
        const percent = (answeredCount / totalQuestions) * 100;
        document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    function showResults() {
        const modal = document.getElementById('result-modal');
        const scoreText = document.getElementById('final-score');
        const praise = document.getElementById('praise-text');

        scoreText.innerText = `${userScore}/${totalQuestions}`;
        
        const percentage = (userScore / totalQuestions) * 100;
        if (percentage === 100) praise.innerText = "Xuất sắc! MS Chí Nên rất tự hào về em! 🌟";
        else if (percentage >= 80) praise.innerText = "Làm rất tốt! Em nắm bài rất chắc chắn! 🎉";
        else if (percentage >= 50) praise.innerText = "Cố gắng thêm chút nữa nhé! Em làm được mà! 💪";
        else praise.innerText = "Đừng buồn nhé, hãy xem lại phần giải thích để hiểu bài hơn! 📚";

        modal.classList.add('active');
        playSound('correct'); // Victory sound
        confetti({
            particleCount: 200,
            spread: 100,
            origin: { y: 0.6 }
        });
    }

    // Init
    initQuiz();

</script>
<style id="ms-chi-nen-unlock-style">
#passwordModal, #password-modal, #pwModal, #pw-modal, #pw-overlay,
#lockModal, #passModal, #authModal, #auth-modal, #lockOverlay,
#start-overlay, #intro-overlay, #start-screen,
.password-modal, .lock-modal, .lock-overlay {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
    z-index: -9999 !important;
}
</style>
<script>
// Remove password lock completely - direct quiz access
(function() {
    var initDone = false;
    var renderCheckDone = false;

    function hideEl(el, hard) {
        if (!el) return;
        if (hard) {
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
            el.style.setProperty('opacity', '0', 'important');
            el.style.setProperty('pointer-events', 'none', 'important');
            el.style.setProperty('z-index', '-9999', 'important');
        } else {
            el.style.display = 'none';
        }
        el.classList.remove('active', 'show', 'open', 'visible', 'flex');
    }

    function hasRenderedQuiz() {
        var containers = document.querySelectorAll(
            '#quiz-container, #quizContainer, #questions-container, #questionPane, #quiz, #questions, #quiz-body, #questions-wrapper, #quiz-list, #quizList, #exercise-container, #app-container .split-container'
        );
        for (var i = 0; i < containers.length; i++) {
            if (containers[i].querySelectorAll('button, input, select, textarea, .question-card, .question-block, .q-card, .quiz-card, .question-item, .q-box, .question, .option-btn, .opt-btn, .ans-btn').length > 0) {
                return true;
            }
        }
        if (document.querySelectorAll('.question-card, .question-block, .q-card, .quiz-card, .question-item, .q-box, .option-btn, .opt-btn, .ans-btn, .choice-btn').length > 0) {
            return true;
        }
        return false;
    }

    function ensureQuizRendered() {
        if (renderCheckDone) return;
        renderCheckDone = true;
        if (hasRenderedQuiz()) return;

        if (!hasRenderedQuiz() && typeof buildQuiz === 'function') { try { buildQuiz(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof initQuiz === 'function') { try { initQuiz(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderApp === 'function') { try { renderApp(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderQuiz === 'function') { try { renderQuiz(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderQuestions === 'function') { try { renderQuestions(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderAllQuestions === 'function') { try { renderAllQuestions(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderAll === 'function') { try { renderAll(); } catch(e){} }
    }

    function unlockNow() {
        var pwIds = [
            'passwordModal', 'password-modal', 'pwModal', 'pw-modal', 'pw-overlay',
            'lockModal', 'passModal', 'authModal', 'auth-modal', 'lockOverlay',
            'start-overlay', 'intro-overlay', 'start-screen'
        ];
        pwIds.forEach(function(id) {
            hideEl(document.getElementById(id), true);
        });

        var modalEls = document.querySelectorAll('.password-modal, .lock-modal, .lock-overlay, #lockOverlay, #auth-modal');
        modalEls.forEach(function(el) {
            if (el.id !== 'resultModal' && el.id !== 'result-modal' && el.id !== 'scoreModal') {
                hideEl(el, true);
            }
        });

        ['nameModal', 'name-modal', 'nameInputModal'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) hideEl(el, false);
        });

        var qo = document.getElementById('quiz-overlay');
        if (qo && (typeof isStarted === 'undefined' || !isStarted)) {
            qo.style.display = 'none';
        }

        var mainIds = [
            'mainContent', 'main-content', 'mainHeader', 'main-header',
            'app-container', 'app', 'quizApp', 'quiz-wrapper', 'quizContainer', 'quiz-container', 'reading-content'
        ];
        mainIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                el.classList.remove('hidden', 'blur', 'blurred', 'locked');
                if (el.style.display === 'none') {
                    el.style.removeProperty('display');
                }
                if (window.getComputedStyle(el).display === 'none') {
                    var hasPane = el.querySelector('.pane, .left-pane, .right-pane, .split-container, .left-panel, .right-panel');
                    if (id === 'main-content' || id.toLowerCase().includes('header') || el.classList.contains('main-container') || hasPane) {
                        el.style.setProperty('display', 'flex', 'important');
                    } else {
                        el.style.setProperty('display', 'block', 'important');
                    }
                }
            }
        });

        var qs = document.getElementById('quiz-screen');
        if (qs) {
            qs.classList.remove('hidden');
            if (qs.classList.contains('flex-col')) {
                qs.classList.add('flex');
                qs.style.display = 'flex';
            } else {
                qs.style.display = 'block';
            }
        }

        if (!initDone) {
            initDone = true;

            if (document.getElementById('start-overlay') && typeof startGame === 'function') {
                var sn = document.getElementById('student-name') || document.getElementById('studentName');
                if (sn && !sn.value.trim()) sn.value = 'Học sinh';
            }
            if (document.getElementById('name-modal') && typeof startQuiz === 'function') {
                var sn2 = document.getElementById('student-name');
                if (sn2 && !sn2.value.trim()) sn2.value = 'Học sinh';
            }

            if (typeof startQuiz === 'function' && (typeof isStarted === 'undefined' || !isStarted)) { try { startQuiz(); } catch(e){} }
            if (typeof startGame === 'function') { try { startGame(); } catch(e){} }
            if (typeof startTest === 'function') { try { startTest(); } catch(e){} }
            if (typeof startApp === 'function') { try { startApp(); } catch(e){} }
            if (typeof buildStarfield === 'function') { try { buildStarfield(); } catch(e){} }
            if (typeof spawnFloats === 'function') { try { spawnFloats(); } catch(e){} }
            if (typeof spawnFloaters === 'function') { try { spawnFloaters(); } catch(e){} }
            if (typeof createFloatingBubbles === 'function') { try { createFloatingBubbles(); } catch(e){} }
            if (typeof initAudio === 'function') { try { initAudio(); } catch(e){} }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockNow);
    } else {
        unlockNow();
    }
    if (document.readyState === 'complete') {
        setTimeout(ensureQuizRendered, 150);
    } else {
        window.addEventListener('load', function() {
            setTimeout(unlockNow, 20);
            setTimeout(ensureQuizRendered, 150);
            setTimeout(unlockNow, 300);
            setTimeout(unlockNow, 700);
        });
    }
    setTimeout(unlockNow, 50);
    setTimeout(unlockNow, 200);
    setTimeout(unlockNow, 600);
    setTimeout(unlockNow, 1100);
})();
</script>
