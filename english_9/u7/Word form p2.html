<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Chí Nên - Word Form Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --accent-color: #FF9F43; /* Cam */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ */
            --bg-pattern: radial-gradient(#ffffff 15%, transparent 16%), radial-gradient(#ffffff 15%, transparent 16%);
            --bg-size: 20px 20px;
            --bg-color: #f3f0ff;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Ngăn bôi đen để trải nghiệm giống app */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-pattern);
            background-position: 0 0, 10px 10px;
            background-size: var(--bg-size);
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid #eee;
            animation: float 3s ease-in-out infinite;
            z-index: 10;
        }

        h1 {
            margin: 0;
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-family: 'Quicksand', sans-serif;
            color: #7f8c8d;
            font-size: 1rem;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        /* Card Styles */
        .quiz-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            border: 2px solid #f0f0f0;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(136, 84, 192, 0.2);
        }

        .question-number {
            background: var(--accent-color);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .highlight-word {
            color: var(--primary-color);
            background: rgba(136, 84, 192, 0.1);
            padding: 2px 8px;
            border-radius: 8px;
            border: 1px dashed var(--primary-color);
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-bottom: 6px solid #e0e0e0; /* 3D effect */
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:active {
            transform: translateY(4px);
            border-bottom: 2px solid #e0e0e0;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f9f9f9;
            border-color: #d0d0d0;
        }

        /* State Classes */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00b85c;
            border-bottom-color: #008f47;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #ff2e40;
            border-bottom-color: #d61c2d;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        .option-btn.correct::after {
            content: '✨';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .option-btn.wrong::after {
            content: '❌';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Explanation Box */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 25px;
            padding: 20px;
            background: #eafbf2;
            border: 2px solid #b8e9cf;
            border-radius: 15px;
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.wrong-choice {
            background: #fff0f1;
            border-color: #fad3d5;
        }

        .teacher-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 10px;
            float: left;
        }

        .explanation-content h4 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .explanation-details {
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #333;
        }
        
        .explanation-details ul {
            padding-left: 20px;
            margin: 5px 0;
        }
        
        .explanation-details li {
            margin-bottom: 5px;
        }

        .explanation-details strong {
            color: #2c3e50;
        }

        /* Submit Button */
        .submit-section {
            text-align: center;
            margin: 40px 0 60px 0;
        }

        .submit-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            border-bottom: 6px solid #00a388;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0, 201, 167, 0.3);
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        .submit-btn:active {
            transform: translateY(4px);
            border-bottom: 2px solid #00a388;
        }

        /* Result Popup */
        .result-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s;
        }

        .result-popup.active {
            visibility: visible;
            opacity: 1;
        }

        .popup-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid var(--primary-color);
        }

        .result-popup.active .popup-content {
            transform: scale(1);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 auto 20px auto;
            border: 5px solid #fff;
            box-shadow: 0 0 0 5px var(--primary-color);
        }

        .result-message {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .close-btn {
            background: #e0e0e0;
            color: #555;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }

        .close-btn:hover {
            background: #d0d0d0;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        /* Formatting helper for rationale */
        .rationale-text b {
            color: #d63031;
            font-weight: 800;
        }
        
    </style>
</head>

    // Shuffle Array Function
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

            oscillator.type = 'sine';

            // Explanation Container (Created initially but hidden)
            const explanation = document.createElement('div');
            explanation.className = 'explanation-box';
            
            const options = ['A', 'B', 'C', 'D'];
            
            // SHUFFLE OPTIONS HERE: Clone and shuffle for this render
            const currentOptions = shuffleArray([...q.answerOptions]);

            currentOptions.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<b>${options[i]}.</b> ${opt.text}`;
                
                btn.onclick = () => {
                    // Disable all buttons in this card
                    const allBtns = grid.querySelectorAll('.option-btn');
                    allBtns.forEach(b => b.disabled = true);

                    // Determine correct/wrong
                    if (opt.isCorrect) {
                        btn.classList.add('correct');
                        playSound('correct');
                        correctCount++;
                        
                        // Show Correct Explanation
                        explanation.innerHTML = `
                            <div class="teacher-avatar">CN</div>
                            <div class="explanation-content">
                                <h4>Tuyệt vời! Chính xác.</h4>
                                <div class="explanation-details rationale-text">${opt.rationale}</div>
                            </div>
                        `;
                    } else {
                        btn.classList.add('wrong');
                        playSound('wrong');
                        explanation.classList.add('wrong-choice');
                        
                        // Find the rationale for the CORRECT answer to show full context
                        const correctOpt = q.answerOptions.find(o => o.isCorrect);
                        
                        // Show Wrong Explanation
                        explanation.innerHTML = `
                            <div class="teacher-avatar" style="background: #FF4757;">CN</div>
                            <div class="explanation-content">
                                <h4 style="color: #FF4757;">Tiếc quá! Chưa chính xác.</h4>
                                <div class="explanation-details rationale-text">
                                    <strong>Đáp án bạn chọn:</strong> ${opt.text}<br><br>
                                    ${correctOpt.rationale}
                                </div>
                            </div>
                        `;
                    }
                    
                    explanation.style.display = 'block';
                };
                
                grid.appendChild(btn);
            });

            card.appendChild(grid);
            card.appendChild(explanation);
            container.appendChild(card);
        });
    }

    // --- FINISH LOGIC ---
    function finishQuiz() {
        const popup = document.getElementById('resultPopup');
        const scoreDisplay = document.getElementById('finalScore');
        const msgDisplay = document.getElementById('resultMessage');
        const detailDisplay = document.getElementById('resultDetail');
        
        const total = questions.length;
        const percentage = (correctCount / total) * 100;

        scoreDisplay.textContent = `${correctCount}/${total}`;
        
        if (percentage === 100) {
            msgDisplay.textContent = "Xuất sắc! 🏆";
            msgDisplay.style.color = "#00D26A";
            detailDisplay.textContent = "Bạn đã nắm vững toàn bộ kiến thức!";
            fireConfetti();
            setTimeout(fireConfetti, 500);
        } else if (percentage >= 80) {
            msgDisplay.textContent = "Làm tốt lắm! 🌟";
            msgDisplay.style.color = "#8854C0";
            detailDisplay.textContent = "Chỉ còn một chút nữa là hoàn hảo.";
        } else if (percentage >= 50) {
            msgDisplay.textContent = "Cố gắng lên! 💪";
            msgDisplay.style.color = "#FF9F43";
            detailDisplay.textContent = "Hãy xem lại phần giải thích để hiểu rõ hơn nhé.";
        } else {
            msgDisplay.textContent = "Đừng nản lòng! 🌱";
            msgDisplay.style.color = "#FF4757";
            detailDisplay.textContent = "Thất bại là mẹ thành công. Hãy thử lại nào!";
        }

        popup.classList.add('active');
    }

    function closePopup() {
        document.getElementById('resultPopup').classList.remove('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- CONFETTI LOGIC ---
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti() {
        canvas.style.display = 'block';
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: window.innerWidth / 2,
                y: window.innerHeight / 2,
                w: Math.random() * 10 + 5,
                h: Math.random() * 10 + 5,
                vx: Math.random() * 20 - 10,
                vy: Math.random() * 20 - 10,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                life: 100
            });
        }
        animateConfetti();
    }

    function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.5; // gravity
            p.life--;
            
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.w, p.h);
            
            if (p.life <= 0) particles.splice(index, 1);
        });
        
        if (particles.length > 0) {
            requestAnimationFrame(animateConfetti);
        } else {
            canvas.style.display = 'none';
        }
    }

    // Initialize
    renderQuiz();

</script>
<style id="ms-chi-nen-unlock-style">
#passwordModal, #password-modal, #pwModal, #pw-modal, #pw-overlay,
#lockModal, #passModal, #authModal, #auth-modal, #lockOverlay,
#start-overlay, #intro-overlay, #start-screen,
.password-modal, .lock-modal, .lock-overlay {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
    z-index: -9999 !important;
}
</style>
<script>
// Remove password lock completely - direct quiz access
(function() {
    var initDone = false;
    var renderCheckDone = false;

    function hideEl(el, hard) {
        if (!el) return;
        if (hard) {
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
            el.style.setProperty('opacity', '0', 'important');
            el.style.setProperty('pointer-events', 'none', 'important');
            el.style.setProperty('z-index', '-9999', 'important');
        } else {
            el.style.display = 'none';
        }
        el.classList.remove('active', 'show', 'open', 'visible', 'flex');
    }

    function hasRenderedQuiz() {
        var containers = document.querySelectorAll(
            '#quiz-container, #quizContainer, #questions-container, #questionPane, #quiz, #questions, #quiz-body, #questions-wrapper, #quiz-list, #quizList, #exercise-container, #app-container .split-container'
        );
        for (var i = 0; i < containers.length; i++) {
            if (containers[i].querySelectorAll('button, input, select, textarea, .question-card, .question-block, .q-card, .quiz-card, .question-item, .q-box, .question, .option-btn, .opt-btn, .ans-btn').length > 0) {
                return true;
            }
        }
        if (document.querySelectorAll('.question-card, .question-block, .q-card, .quiz-card, .question-item, .q-box, .option-btn, .opt-btn, .ans-btn, .choice-btn').length > 0) {
            return true;
        }
        return false;
    }

    function ensureQuizRendered() {
        if (renderCheckDone) return;
        renderCheckDone = true;
        if (hasRenderedQuiz()) return;

        if (!hasRenderedQuiz() && typeof buildQuiz === 'function') { try { buildQuiz(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof initQuiz === 'function') { try { initQuiz(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderApp === 'function') { try { renderApp(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderQuiz === 'function') { try { renderQuiz(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderQuestions === 'function') { try { renderQuestions(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderAllQuestions === 'function') { try { renderAllQuestions(); } catch(e){} }
        if (!hasRenderedQuiz() && typeof renderAll === 'function') { try { renderAll(); } catch(e){} }
    }

    function unlockNow() {
        var pwIds = [
            'passwordModal', 'password-modal', 'pwModal', 'pw-modal', 'pw-overlay',
            'lockModal', 'passModal', 'authModal', 'auth-modal', 'lockOverlay',
            'start-overlay', 'intro-overlay', 'start-screen'
        ];
        pwIds.forEach(function(id) {
            hideEl(document.getElementById(id), true);
        });

        var modalEls = document.querySelectorAll('.password-modal, .lock-modal, .lock-overlay, #lockOverlay, #auth-modal');
        modalEls.forEach(function(el) {
            if (el.id !== 'resultModal' && el.id !== 'result-modal' && el.id !== 'scoreModal') {
                hideEl(el, true);
            }
        });

        ['nameModal', 'name-modal', 'nameInputModal'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) hideEl(el, false);
        });

        var qo = document.getElementById('quiz-overlay');
        if (qo && (typeof isStarted === 'undefined' || !isStarted)) {
            qo.style.display = 'none';
        }

        var mainIds = [
            'mainContent', 'main-content', 'mainHeader', 'main-header',
            'app-container', 'app', 'quizApp', 'quiz-wrapper', 'quizContainer', 'quiz-container', 'reading-content'
        ];
        mainIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                el.classList.remove('hidden', 'blur', 'blurred', 'locked');
                if (el.style.display === 'none') {
                    el.style.removeProperty('display');
                }
                if (window.getComputedStyle(el).display === 'none') {
                    var hasPane = el.querySelector('.pane, .left-pane, .right-pane, .split-container, .left-panel, .right-panel');
                    if (id === 'main-content' || id.toLowerCase().includes('header') || el.classList.contains('main-container') || hasPane) {
                        el.style.setProperty('display', 'flex', 'important');
                    } else {
                        el.style.setProperty('display', 'block', 'important');
                    }
                }
            }
        });

        var qs = document.getElementById('quiz-screen');
        if (qs) {
            qs.classList.remove('hidden');
            if (qs.classList.contains('flex-col')) {
                qs.classList.add('flex');
                qs.style.display = 'flex';
            } else {
                qs.style.display = 'block';
            }
        }

        if (!initDone) {
            initDone = true;

            if (document.getElementById('start-overlay') && typeof startGame === 'function') {
                var sn = document.getElementById('student-name') || document.getElementById('studentName');
                if (sn && !sn.value.trim()) sn.value = 'Học sinh';
            }
            if (document.getElementById('name-modal') && typeof startQuiz === 'function') {
                var sn2 = document.getElementById('student-name');
                if (sn2 && !sn2.value.trim()) sn2.value = 'Học sinh';
            }

            if (typeof startQuiz === 'function' && (typeof isStarted === 'undefined' || !isStarted)) { try { startQuiz(); } catch(e){} }
            if (typeof startGame === 'function') { try { startGame(); } catch(e){} }
            if (typeof startTest === 'function') { try { startTest(); } catch(e){} }
            if (typeof startApp === 'function') { try { startApp(); } catch(e){} }
            if (typeof buildStarfield === 'function') { try { buildStarfield(); } catch(e){} }
            if (typeof spawnFloats === 'function') { try { spawnFloats(); } catch(e){} }
            if (typeof spawnFloaters === 'function') { try { spawnFloaters(); } catch(e){} }
            if (typeof createFloatingBubbles === 'function') { try { createFloatingBubbles(); } catch(e){} }
            if (typeof initAudio === 'function') { try { initAudio(); } catch(e){} }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockNow);
    } else {
        unlockNow();
    }
    if (document.readyState === 'complete') {
        setTimeout(ensureQuizRendered, 150);
    } else {
        window.addEventListener('load', function() {
            setTimeout(unlockNow, 20);
            setTimeout(ensureQuizRendered, 150);
            setTimeout(unlockNow, 300);
            setTimeout(unlockNow, 700);
        });
    }
    setTimeout(unlockNow, 50);
    setTimeout(unlockNow, 200);
    setTimeout(unlockNow, 600);
    setTimeout(unlockNow, 1100);
})();
</script>
